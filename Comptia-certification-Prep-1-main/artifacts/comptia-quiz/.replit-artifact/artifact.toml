kind = "web"
previewPath = "/"
title = "CompTIA Trifecta Quiz"
version = "1.0.0"
id = "artifacts/comptia-quiz"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25263

[services.development]
run = "pnpm --filter @workspace/comptia-quiz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/comptia-quiz", "run", "build" ]
publicDir = "artifacts/comptia-quiz/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25263"
BASE_PATH = "/"
