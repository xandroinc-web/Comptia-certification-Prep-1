openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quiz_results
    description: Quiz result tracking
  - name: stripe
    description: Payment and subscription
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /quiz-results:
    get:
      operationId: getQuizResults
      tags: [quiz_results]
      summary: Get user's quiz results
      responses:
        "200":
          description: List of quiz results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizResult"
    post:
      operationId: createQuizResult
      tags: [quiz_results]
      summary: Save a quiz result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuizResult"
      responses:
        "201":
          description: Quiz result created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
  /products-with-prices:
    get:
      operationId: getProductsWithPrices
      tags: [stripe]
      summary: List products with prices
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"
  /checkout:
    post:
      operationId: createCheckout
      tags: [stripe]
      summary: Create checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
  /subscription:
    get:
      operationId: getSubscription
      tags: [stripe]
      summary: Get user subscription
      responses:
        "200":
          description: Subscription info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /customer-portal:
    post:
      operationId: createCustomerPortal
      tags: [stripe]
      summary: Create billing portal
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalResponse"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Load the protected admin overview
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Unauthorized
        "403":
          description: Not an admin
  /app-settings:
    get:
      operationId: getAppSettings
      tags: [admin]
      summary: Load public app settings
      responses:
        "200":
          description: Public app settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /managed-questions:
    get:
      operationId: getManagedQuestions
      tags: [admin]
      summary: Load active admin-managed question overrides
      responses:
        "200":
          description: Active managed questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminQuestion"
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check protected admin role and permissions
      responses:
        "200":
          description: Server-authorized admin role and permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessResponse"
  /admin/simulation-events:
    post:
      operationId: createAdminSimulationEvent
      tags: [admin]
      summary: Record a simulated learner journey in the admin audit log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSimulationEventInput"
      responses:
        "201":
          description: Simulation event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /admin/questions:
    get:
      operationId: getAdminQuestions
      tags: [admin]
      summary: List managed questions
      responses:
        "200":
          description: Managed question list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestionsResponse"
    post:
      operationId: createAdminQuestion
      tags: [admin]
      summary: Create a managed question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuestionInput"
      responses:
        "201":
          description: Managed question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
  /admin/questions/{id}:
    patch:
      operationId: updateAdminQuestion
      tags: [admin]
      summary: Update, re-tier, or change difficulty for a managed question
      parameters:
        - $ref: "#/components/parameters/AdminQuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuestionInput"
      responses:
        "200":
          description: Managed question updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
    delete:
      operationId: deleteAdminQuestion
      tags: [admin]
      summary: Delete a managed question
      parameters:
        - $ref: "#/components/parameters/AdminQuestionId"
      responses:
        "200":
          description: Managed question deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /admin/settings:
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update app-wide admin settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetting"
  /admin/media:
    post:
      operationId: createAdminMedia
      tags: [admin]
      summary: Add an admin-managed video or external link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMediaInput"
      responses:
        "201":
          description: Media item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMedia"
  /admin/media/{id}:
    patch:
      operationId: updateAdminMedia
      tags: [admin]
      summary: Update an admin-managed media item
      parameters:
        - $ref: "#/components/parameters/AdminMediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMediaUpdate"
      responses:
        "200":
          description: Updated media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMedia"
    delete:
      operationId: deleteAdminMedia
      tags: [admin]
      summary: Delete an admin-managed media item
      parameters:
        - $ref: "#/components/parameters/AdminMediaId"
      responses:
        "200":
          description: Media item deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List users through Clerk
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create a user through Clerk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /admin/users/{userId}/action:
    post:
      operationId: applyAdminUserAction
      tags: [admin]
      summary: Ban, unban, delete, or cancel a user's subscription
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserAction"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResponse"
  /admin/audit:
    get:
      operationId: getAdminAudit
      tags: [admin]
      summary: Load admin audit history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Audit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditResponse"
components:
  parameters:
    AdminMediaId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AdminQuestionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuizResult:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        category:
          type: string
        mode:
          type: string
        score:
          type: integer
        totalQuestions:
          type: integer
        correctCount:
          type: integer
        scaledScore:
          type: integer
        weakAreaIds:
          type: array
          items:
            type: integer
        completedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - category
        - mode
        - score
        - totalQuestions
        - correctCount
        - scaledScore
        - weakAreaIds
        - completedAt
    CreateQuizResult:
      type: object
      properties:
        category:
          type: string
        mode:
          type: string
        score:
          type: integer
        totalQuestions:
          type: integer
        correctCount:
          type: integer
        scaledScore:
          type: integer
        weakAreaIds:
          type: array
          items:
            type: integer
      required:
        - category
        - mode
        - score
        - totalQuestions
        - correctCount
        - scaledScore
        - weakAreaIds
    CheckoutRequest:
      type: object
      properties:
        priceId:
          type: string
      required:
        - priceId
    CheckoutResponse:
      type: object
      properties:
        url:
          type: string
      required:
        - url
    SubscriptionResponse:
      type: object
      properties:
        subscription:
          type: object
          nullable: true
          properties:
            status:
              type: string
            current_period_end:
              type: string
            cancel_at_period_end:
              type: boolean
    PortalResponse:
      type: object
      properties:
        url:
          type: string
      required:
        - url
    ProductsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              active:
                type: boolean
              prices:
                type: array
                items:
                  type: object
      required:
        - data
    AdminSetting:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required: [key, value, updatedAt, updatedBy]
    AdminSettingsInput:
      type: object
      additionalProperties: true
    AdminMedia:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        title:
          type: string
        url:
          type: string
        description:
          type: ["string", "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
      required: [id, kind, title, url, description, active, createdAt, updatedAt, createdBy]
    AdminMediaInput:
      type: object
      properties:
        kind:
          type: string
          enum: [video, link]
        title:
          type: string
        url:
          type: string
          format: uri
        description:
          type: string
        active:
          type: boolean
      required: [title, url]
    AdminMediaUpdate:
      type: object
      properties:
        kind:
          type: string
          enum: [video, link]
        title:
          type: string
        url:
          type: string
          format: uri
        description:
          type: ["string", "null"]
        active:
          type: boolean
    AdminAuditLog:
      type: object
      properties:
        id:
          type: integer
        actorUserId:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: ["string", "null"]
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required: [id, actorUserId, action, targetType, targetId, metadata, createdAt]
    AdminStats:
      type: object
      properties:
        users:
          type: integer
        quizResults:
          type: integer
        activeSubscriptions:
          type: integer
        activeMedia:
          type: integer
      required: [users, quizResults, activeSubscriptions, activeMedia]
    AdminOverview:
      type: object
      properties:
        stats:
          $ref: "#/components/schemas/AdminStats"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/AdminSetting"
        media:
          type: array
          items:
            $ref: "#/components/schemas/AdminMedia"
        auditLogs:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditLog"
        products:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [stats, settings, media, auditLogs, products]
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        banned:
          type: boolean
        locked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSignInAt:
          type: ["string", "null"]
          format: date-time
      required: [id, email, firstName, lastName, imageUrl, banned, locked, createdAt, lastSignInAt]
    AdminUsersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        totalCount:
          type: integer
      required: [data, totalCount]
    AdminUserInput:
      type: object
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
      required: [email]
    AdminUserAction:
      type: object
      properties:
        action:
          type: string
          enum: [ban, unban, delete, cancel_subscription]
      required: [action]
    AdminActionResponse:
      type: object
      properties:
        success:
          type: boolean
        action:
          type: string
        userId:
          type: string
      required: [success, action, userId]
    AdminAuditResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditLog"
      required: [data]
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    AppSettings:
      type: object
      properties:
        announcement:
          type: string
        maintenanceMode:
          type: boolean
        pricingHeadline:
          type: string
        monthlyPriceLabel:
          type: string
        yearlyPriceLabel:
          type: string
      required: [announcement, maintenanceMode, pricingHeadline, monthlyPriceLabel, yearlyPriceLabel]
    AdminAccessResponse:
      type: object
      properties:
        isAdmin:
          type: boolean
        freeTestSimulation:
          type: boolean
        role:
          type: string
          enum: [owner, admin, quiz_tester]
        permissions:
          type: array
          items:
            type: string
            enum: [dashboard:read, dashboard:overview, quiz:read, quiz:manage, settings:manage, media:manage, users:read, users:manage, audit:read, simulation:run]
      required: [isAdmin, freeTestSimulation, role, permissions]
    AdminSimulationEventInput:
      type: object
      properties:
        profile:
          type: string
          enum: [free, pro, hellmode, restricted]
        event:
          type: string
          enum: [session_started, quiz_started, quiz_completed, access_blocked, session_ended]
        dailyQuizLimit:
          type: integer
          minimum: 0
          maximum: 100
        quizMode:
          type: string
          maxLength: 100
        scorePercent:
          type: integer
          minimum: 0
          maximum: 100
        featureFlags:
          type: object
          properties:
            timedSimulations:
              type: boolean
            topicStudy:
              type: boolean
            tierProgression:
              type: boolean
            bonusQuestions:
              type: boolean
          required: [timedSimulations, topicStudy, tierProgression, bonusQuestions]
      required: [profile, event, dailyQuizLimit, featureFlags]
    AdminQuestion:
      type: object
      properties:
        id:
          type: integer
        externalId:
          type: ["string", "null"]
        category:
          type: string
        tier:
          type: integer
          enum: [1, 2, 3]
        difficulty:
          type: string
          enum: [easy, medium, hard]
        question:
          type: string
        options:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
        correctIndex:
          type: integer
        explanation:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
      required: [id, externalId, category, tier, difficulty, question, options, correctIndex, explanation, active, createdAt, updatedAt, createdBy]
    AdminQuestionInput:
      type: object
      properties:
        externalId:
          type: string
        category:
          type: string
        tier:
          type: integer
          enum: [1, 2, 3]
        difficulty:
          type: string
          enum: [easy, medium, hard]
        question:
          type: string
        options:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
        correctIndex:
          type: integer
        explanation:
          type: string
        active:
          type: boolean
      required: [question, options, correctIndex]
    AdminQuestionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuestion"
      required: [data]

